name: Build Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-linux-executable:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk pipx

      - name: Build standalone executable
        run: |
          chmod +x build_executable.sh
          ./build_executable.sh

      - name: Verify headless error message
        run: |
          set +e
          ./dist/linux-hid-mouse > headless.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "No graphical display session was detected" headless.log

      - name: Verify packaged executable metadata
        run: |
          file ./dist/linux-hid-mouse | grep -E 'ELF 64-bit.*x86-64'

      - name: Package executable artifact
        run: |
          tar -C dist -czf linux-hid-mouse-linux-x86_64.tar.gz linux-hid-mouse

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-hid-mouse-x86_64
          path: linux-hid-mouse-linux-x86_64.tar.gz
          if-no-files-found: error