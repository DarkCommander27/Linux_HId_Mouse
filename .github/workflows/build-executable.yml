name: Build Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-linux-executable:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk pipx xvfb

      - name: Build standalone executable
        run: |
          chmod +x build_executable.sh
          ./build_executable.sh

      - name: Smoke test executable startup
        run: |
          timeout 5 xvfb-run -a ./dist/linux-hid-mouse || test $? -eq 124

      - name: Package executable artifact
        run: |
          tar -C dist -czf linux-hid-mouse-linux-x86_64.tar.gz linux-hid-mouse

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-hid-mouse
          path: linux-hid-mouse-linux-x86_64.tar.gz
          if-no-files-found: error